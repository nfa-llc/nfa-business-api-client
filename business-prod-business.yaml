openapi: 3.0.1
info:
  title: 'business.gexbot.com/business'
  description: 'Business user endpoints for business.gexbot.com'
  version: '1.0'
servers:
- url: 'https://business.gexbot.com'
paths:
  /user/children:
    get:
      tags:
      - User
      - Children
      summary: List children accounts
      description: Retrieve a list of children accounts managed by the parent.
      operationId: get-user-children
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ChildListResponse'
    post:
      tags:
      - User
      - Children
      summary: Create child account
      description: Create a new child account for a specific product and integration.
      operationId: post-user-children
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateChildRequest'
      responses:
        '200':
          description: OK
  /user/children/{child_id}:
    get:
      tags:
      - User
      - Children
      summary: Get child account details
      description: Retrieve details of a specific child account.
      operationId: get-user-child
      parameters:
      - name: child_id
        in: path
        required: true
        schema:
          type: string
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Child'
    delete:
      tags:
      - User
      - Children
      summary: Delete child account
      description: Delete a specific child account.
      operationId: delete-user-child
      parameters:
      - name: child_id
        in: path
        required: true
        schema:
          type: string
      responses:
        '200':
          description: OK
  /user/children/{child_id}/key:
    post:
      tags:
      - User
      - API Key
      - Children
      summary: Create child API key
      description: Create a new API key for a child account.
      operationId: post-user-child-key
      parameters:
      - name: child_id
        in: path
        required: true
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateApiKeyRequest'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiKey'
    patch:
      tags:
      - User
      - API Key
      - Children
      summary: Rotate child API key
      description: Rotate an existing API key for a child account.
      operationId: patch-user-child-key
      parameters:
      - name: child_id
        in: path
        required: true
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateApiKeyRequest'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiKey'
    delete:
      tags:
      - User
      - API Key
      - Children
      summary: Delete child API key
      description: Delete an API key for a child account.
      operationId: delete-user-child-key
      parameters:
      - name: child_id
        in: path
        required: true
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DeleteApiKeyRequest'
      responses:
        '200':
          description: OK
  /user/keys:
    get:
      tags:
      - User
      - API Key
      summary: List personal API keys
      description: Retrieve a list of personal API keys.
      operationId: get-user-keys
      parameters:
      - name: product
        in: query
        schema:
          type: string
      - name: integration
        in: query
        schema:
          type: string
      - name: status
        in: query
        schema:
          type: string
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiKeyListResponse'
    post:
      tags:
      - User
      - API Key
      summary: Create personal API key
      description: Create a new personal API key.
      operationId: post-user-keys
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateApiKeyRequest'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiKey'
    patch:
      tags:
      - User
      - API Key
      summary: Rotate personal API key
      description: Rotate an existing personal API key.
      operationId: patch-user-keys
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateApiKeyRequest'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiKey'
    delete:
      tags:
      - User
      - API Key
      summary: Delete personal API key
      description: Delete an existing personal API key.
      operationId: delete-user-keys
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DeleteApiKeyRequest'
      responses:
        '200':
          description: OK
components:
  schemas:
    _int:
      type: integer
    _string:
      type: string
    _timestamp:
      type: string
      format: date-time
      example: '2025-08-19T12:00:00.0000000+00:00'
    level:
      type: string
      enum:
      - orderflow
      - classic
      - state
      - free
      - paid
      - unverified
      - unpaid
    Child:
      type: object
      properties:
        id:
          $ref: '#/components/schemas/_string'
        parent_user_id:
          $ref: '#/components/schemas/_string'
        level:
          type: array
          items:
            $ref: '#/components/schemas/level'
        api_keys:
          type: array
          items:
            $ref: '#/components/schemas/ApiKey'
        created:
          $ref: '#/components/schemas/_timestamp'
    ChildListResponse:
      type: object
      properties:
        count:
          $ref: '#/components/schemas/_int'
        children:
          type: array
          items:
            $ref: '#/components/schemas/Child'
    ApiKey:
      type: object
      properties:
        id:
          $ref: '#/components/schemas/_string'
        secret:
          $ref: '#/components/schemas/_string'
        identifier:
          $ref: '#/components/schemas/_string'
        product:
          $ref: '#/components/schemas/_string'
        label:
          $ref: '#/components/schemas/_string'
        integration:
          $ref: '#/components/schemas/_string'
        created_at:
          $ref: '#/components/schemas/_timestamp'
        expires_at:
          $ref: '#/components/schemas/_timestamp'
    ApiKeyListResponse:
      type: object
      properties:
        count:
          $ref: '#/components/schemas/_int'
        api_keys:
          type: array
          items:
            $ref: '#/components/schemas/ApiKey'
    CreateChildRequest:
      type: object
      required:
      - expires_in
      properties:
        product:
          $ref: '#/components/schemas/_string'
        integration:
          $ref: '#/components/schemas/_string'
        label:
          $ref: '#/components/schemas/_string'
        expires_in:
          $ref: '#/components/schemas/_int'
    CreateApiKeyRequest:
      type: object
      properties:
        product:
          $ref: '#/components/schemas/_string'
        integration:
          $ref: '#/components/schemas/_string'
        label:
          $ref: '#/components/schemas/_string'
        expires_in:
          $ref: '#/components/schemas/_int'
    UpdateApiKeyRequest:
      type: object
      properties:
        id:
          $ref: '#/components/schemas/_string'
        product:
          $ref: '#/components/schemas/_string'
        label:
          $ref: '#/components/schemas/_string'
        expires_in:
          $ref: '#/components/schemas/_int'
    DeleteApiKeyRequest:
      type: object
      properties:
        id:
          $ref: '#/components/schemas/_string'
        product:
          $ref: '#/components/schemas/_string'
  securitySchemes:
    authorizationApiKey:
      type: apiKey
      in: header
      name: Authorization
security:
- authorizationApiKey: []
tags:
- name: User
  description: User operations
- name: API Key
  description: API key operations
- name: Children
  description: Child account operations

